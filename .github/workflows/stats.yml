name: Generate GitHub Readme Stats

on:
  schedule:
    # Runs every 12 hours to update your stats
    - cron: '0 */12 * * *'
  workflow_dispatch: # Allows you to run it manually anytime

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Stats SVG
        uses: anuraghazra/github-readme-stats-action@v2
        with:
          gh_token: ${{ secrets.GH_TOKEN }}
          show_icons: true
          count_private: true
          output_dir: ./generated-stats # Saves the image to this folder

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add ./generated-stats/*.svg
          git diff-index --quiet HEAD || git commit -m "chore: update github stats"
          git push
